async function loadOlderChannel(){const c=selected;if(!c?.id||!c.nextPage||olderLoading.has(c.id))return;olderLoading.add(c.id);const token=c.nextPage;delete c.olderError;try{const d=await api('/api/uploads?id='+encodeURIComponent(c.id)+'&page='+encodeURIComponent(token));if(!ch(c.id)||c.nextPage!==token)return;mergeApprovedVideos(d.videos,c.id);if(d.nextPage===token)throw Error('YouTube repeated this upload page. Try again later.');c.nextPage=d.nextPage||null;await persist()}catch(e){c.olderError=e.message;toast(e.message)}finally{olderLoading.delete(c.id);if(selected?.id===c.id)render()}}

function homeArtwork(v,hero=false){const p=st.progress[v.id];return '<span class="home-artwork artwork-glass '+(isFreshUpload(v)?'fresh ':'')+(p?.finished?'watched':'')+'" data-fresh-video="'+esc(v.id)+'"><img src="'+esc(v.thumbnail||'./assets/video-unavailable.svg')+'" alt="" width="640" height="360" '+(hero?'fetchpriority="high"':'loading="lazy"')+' decoding="async" data-image-fallback="video">'+(v.live?'<span class="duration live-duration">LIVE</span>':v.duration?'<span class="duration">'+time(v.duration)+'</span>':'')+(p?'<span class="progress" style="width:'+Math.max(0,Math.min(100,(p.position/(p.duration||v.duration))*100||0))+'%"></span>':'')+'</span>'}
let homeMode='For you';
function personalHomeFeed(now=Date.now()){
 const videos=homeUploads().filter(v=>!v.upcoming),affinities=new Map(),recentCounts=new Map();
 for(const v of videos){const at=st.history[v.id]?.at;if(at&&now-at>=0&&now-at<30*86400000)recentCounts.set(v.channelId,(recentCounts.get(v.channelId)||0)+Math.exp(-(now-at)/(14*86400000)))}
 const signals=st.channels.filter(c=>c.id).map(c=>[c.id,Math.log1p(Math.max(0,c.watchSeconds||0)/60)*3+Math.log1p(Math.max(0,c.visits||0))+Math.log1p(recentCounts.get(c.id)||0)*2]);
 const peak=Math.max(1,...signals.map(x=>x[1]));for(const[id,value]of signals)affinities.set(id,value/peak);
 const candidates=videos.map(v=>{const p=st.progress[v.id],age=Math.max(0,(now-Date.parse(v.published))/86400000),fresh=Number.isFinite(age)?Math.exp(-age/14):0;return{v,score:60*(affinities.get(v.channelId)||0)+25*fresh+(p?.finished?-45:10)+(p?.position>0&&!p.finished?8:0)+(v.live?8:0)-(isShortForm(v)?15:0)}});
 const groups=new Map();for(const x of candidates){if(!groups.has(x.v.channelId))groups.set(x.v.channelId,{items:[],index:0});groups.get(x.v.channelId).items.push(x)}for(const g of groups.values())g.items.sort((a,b)=>b.score-a.score||Date.parse(b.v.published)-Date.parse(a.v.published));
 const result=[],seen=new Map();let previous=null;
 while(groups.size){let bestId=null,bestScore=-Infinity;for(const[id,g]of groups){const x=g.items[g.index],score=x.score-18*(seen.get(id)||0)-(previous===id?12:0);if(score>bestScore){bestScore=score;bestId=id}}const g=groups.get(bestId),v=g.items[g.index++].v;result.push(v);seen.set(bestId,(seen.get(bestId)||0)+1);previous=bestId;if(g.index===g.items.length)groups.delete(bestId)}
 return result;
}
function homeFeed(){return homeMode==='Latest'?homeUploads():personalHomeFeed()}

function uploadAge(value){const at=Date.parse(value),elapsed=Date.now()-at;if(!Number.isFinite(at))return '';if(elapsed<0)return date(value);const n=Math.floor(elapsed/60000);if(n<1)return 'Just now';if(n<60)return n+' min ago';if(n<1440){const h=Math.floor(n/60);return h+' hour'+(h===1?'':'s')+' ago'}if(n<10080){const d=Math.floor(n/1440);return d+' day'+(d===1?'':'s')+' ago'}return date(value)}
function homeCard(v){if(!ch(v.channelId)||!/^[\w-]{11}$/.test(v.id))return '';const c=ch(v.channelId),p=st.progress[v.id];return '<article class="home-video-card '+(p?.finished?'done':'')+'"><button class="home-video-art" data-video="'+esc(v.id)+'" aria-label="Watch '+esc(v.title)+'">'+homeArtwork(v)+'</button><div class="home-video-info"><button class="home-video-channel" data-channel="'+esc(c.key)+'" aria-label="Open '+esc(c.name)+'">'+homeAvatar(c)+'</button><div class="home-video-copy"><button class="home-video-title" data-video="'+esc(v.id)+'">'+esc(v.title)+'</button><div class="home-video-meta">'+esc(c.name)+' · '+esc(uploadAge(v.published))+(p?.finished?' · Watched':'')+'</div></div><details class="home-video-menu"><summary aria-label="Actions for '+esc(v.title)+'">'+uiIcon('more')+'</summary><div><button data-share-video="'+esc(v.id)+'">Share</button><button data-channel="'+esc(c.key)+'">Open channel</button>'+(p?'<button data-home-restart="'+esc(v.id)+'">Play from beginning</button>':'')+'</div></details></div></article>'}
function homePage(){const videos=homeUploads().filter(v=>category==='All'||ch(v.channelId)?.category===category);return homeHero()+homeChannels()+'<section class="home-feed" aria-labelledby="latest-heading"><div class="section-heading" id="latest-feed"><h2 id="latest-heading">'+(homeMode==='Latest'?'Latest uploads':'For you')+'</h2><div class="home-feed-actions"><div class="home-feed-tabs" aria-label="Home feed order">'+['For you','Latest'].map(mode=>'<button class="home-mode" data-home-mode="'+mode+'" aria-pressed="'+(homeMode===mode)+'">'+mode+'</button>').join('')+'</div><button id="refresh" aria-label="Refresh uploads" '+(refreshing?'disabled':'')+'>'+uiIcon('refresh')+'</button></div></div><div class="filters home-category-filters" aria-label="Upload categories">'+['All','Packers','NFL','NBA','Golf','Ministry'].map(c=>'<button class="chip '+(category===c?'on':'')+'" data-filter="'+c+'" aria-pressed="'+(category===c)+'">'+c+'</button>').join('')+'<button class="chip category-icon-chip" data-nav="continue">'+uiIcon('continue')+'<span>Continue</span></button></div><p class="home-refresh-status" role="status">'+(refreshing?'Refreshing uploads…':'')+'</p><div class="home-feed-grid">'+(videos.length?videos.map(homeCard).join(''):empty('Your uploads will appear here','Only your approved channels appear in this feed.','<button class="pill" data-nav="settings">Open settings</button>'))+'</div></section>'}
function bindHomeImages(){document.querySelectorAll('[data-image-fallback]').forEach(img=>{const art=()=>{if(img.naturalWidth&&img.naturalHeight&&img.dataset.imageFallback==='video')img.parentElement?.classList.toggle('portrait-source',img.naturalWidth/img.naturalHeight<1.2)};img.addEventListener('load',art,{once:true});img.addEventListener('error',()=>{img.parentElement?.classList.add('image-unavailable');img.src=img.dataset.imageFallback==='avatar'?'./assets/avatar.svg':'./assets/video-unavailable.svg'},{once:true});if(img.complete)art()})}

function channelCarousel(){let list=rankedChannels().filter(c=>!channelNameQuery||normalizeSearch(c.name+' '+(c.handle||'')).includes(normalizeSearch(channelNameQuery)));let c=list.find(c=>c.key===carouselKey)||list[0];if(c)carouselKey=c.key;const i=list.indexOf(c);let html='<div class="intro"><div><span class="eyebrow">YOUR PRIVATE NETWORKS</span><h1>Channels</h1><p class="muted">The creators you chose. Ordered by your viewing.</p></div><a class="pill" href="#manage-channels">Manage</a></div><form id="channel-selector-search" class="channel-search"><input id="channel-name-query" value="'+esc(channelNameQuery)+'" placeholder="Find an approved channel" aria-label="Find an approved channel"><button class="pill">Find</button>'+(channelNameQuery?'<button type="button" class="pill" id="clear-channel-name">Clear</button>':'')+'</form>';
if(!c)return html+empty('No connected channels match','Clear the filter or connect a channel below.');

for(let n=Math.max(0,i-1);n<=Math.min(list.length-1,i+1);n++){const x=list[n],active=n===i;html+='<button class="network-card '+(active?'center':n<i?'previous':'following')+'" '+(active?'data-channel="':'data-preview-channel="')+esc(x.key)+'" aria-label="'+(active?'Open ':'Preview ')+esc(x.name)+'">'+bubble(x)+'<span class="eyebrow">'+esc(x.category)+'</span><strong>'+esc(x.name)+'</strong><span class="muted">'+(active?'View channel →':'Preview →')+'</span></button>'}html+='</section><div class="section-heading"><h2>All channels</h2><span class="muted">Select a preview</span></div><div class="channels channel-selector">'+list.map(x=>'<button class="channel '+(x.key===c.key?'chosen':'')+'" data-preview-channel="'+esc(x.key)+'" aria-pressed="'+(x.key===c.key)+'">'+bubble(x)+'<span>'+esc(x.name)+'</span></button>').join('')+'</div>';
const videos=approvedUploads().filter(v=>v.channelId===c.id&&!v.upcoming).sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));const live=videos.find(v=>v.live);html+='<div class="section-heading"><div><span class="eyebrow">'+esc(c.name)+'</span><h2>Recent uploads</h2></div><button class="pill" data-channel-videos="'+esc(c.key)+'">See all</button></div>'+(live?'<button class="pill red" data-video="'+esc(live.id)+'">● Watch live</button>':'')+(videos.length?'<div class="grid">'+videos.slice(0,6).map(card).join('')+'</div>':empty('No uploads loaded','Refresh your approved channels to load this library.'));return html}
function moveChannelPreview(delta){const list=rankedChannels().filter(c=>!channelNameQuery||normalizeSearch(c.name+' '+(c.handle||'')).includes(normalizeSearch(channelNameQuery))),i=list.findIndex(c=>c.key===carouselKey),next=list[i+delta];if(next){carouselKey=next.key;render()}}
function searchData(){let videos=approvedUploads().filter(v=>!query||searchScore(v,query)>0||remoteSearch?.key===searchKey()&&remoteSearch.ids.has(v.id));videos.sort((a,b)=>searchOrder==='Newest'?Date.parse(b.published)-Date.parse(a.published):searchOrder==='Oldest'?Date.parse(a.published)-Date.parse(b.published):searchOrder==='Most viewed'?(b.views||0)-(a.views||0):searchScore(b,query)-searchScore(a,query)||Date.parse(b.published)-Date.parse(a.published));const channels=rankedChannels().filter(c=>!query||normalizeSearch(c.name+' '+(c.handle||'')).includes(normalizeSearch(query)));const playlists=[...playlistSearchCache.values()].filter(p=>ch(p.channelId)&&Date.now()-(p.cachedAt||0)<30*86400000&&(!query||normalizeSearch(p.title+' '+(p.description||'')+' '+ch(p.channelId).name).includes(normalizeSearch(query))));return {videos,channels,playlists}}
function groupedSearchPage(){const d=searchData();let h='<div class="intro"><div><span class="eyebrow">WITHIN YOUR APPROVED LIBRARY</span><h1>Find your next watch.</h1></div></div><form class="large-search" id="library-search"><input id="library-query" placeholder="Search titles, topics or channels" aria-label="Search approved library" value="'+esc(query)+'"><button class="pill red">Search</button><button type="button" class="pill" id="clear-search">Clear</button></form><div class="search-filters">'+['All','Videos','Shorts','Live','Playlists','Channels'].map(k=>'<button class="chip '+(searchKind===k?'on':'')+'" data-search-kind="'+k+'" aria-pressed="'+(searchKind===k)+'">'+k+'</button>').join('')+'<label>Sort <select id="search-order">'+['Relevance','Newest','Oldest','Most viewed'].map(o=>'<option '+(o===searchOrder?'selected':'')+'>'+o+'</option>').join('')+'</select></label></div>';

$('#searchform').onsubmit=e=>{e.preventDefault();const value=$('#query').value.trim();if(parseVideoUrl(value))return openVideoUrl(value);query=value;searchVisible=100;remoteSearch=null;if(route==='channel')tab='Videos';if(!['channel','history','continue'].includes(route))route='search';render();if(query&&youtubeKey&&['channel','search'].includes(route))indexOlderUploads(3)};document.addEventListener('visibilitychange',()=>{saveProgress();if(document.hidden){if(playerReady)player?.pauseVideo()}else if(route==='history'||route==='continue')render()});window.addEventListener('scroll',()=>{$('#channel-tabs')?.classList.toggle('compact',scrollY>150)},{passive:true});window.addEventListener('pagehide',()=>saveProgress());let touchY=0;document.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(scrollY===0&&e.changedTouches[0].clientY-touchY>100&&route==='home'&&!$('#player-shell').classList.contains('shorts-full'))refresh(true)},{passive:true});
function playlistContext(v){return playlistView===v&&route==='channel'&&tab==='Playlists'&&selected?.id===v.channelId}
function renderPlaylistView(){const v=playlistView;if(!v||!playlistContext(v)||!$('#playlists'))return;const a=v.active;let html='';
 if(!a){html='<div class="section-heading"><h2>Creator playlists</h2><span class="muted">Original order. Approved videos only.</span></div><div class="playlist-grid">'+v.items.map(p=>'<button class="playlist-card" data-playlist="'+esc(p.id)+'"><span class="playlist-art">▤<small>PLAYLIST</small></span><strong>'+esc(p.title)+'</strong><span class="muted">'+(Number.isFinite(p.itemCount)?p.itemCount+' YouTube entries':'Browse collection')+'</span><span class="playlist-open">Open playlist →</span></button>').join('')+'</div>'+(v.error?'<p role="status">'+esc(v.error)+'</p><button class="pill" id="retry-playlists">Retry playlists</button>':'')+(v.loadingList?'<p role="status">Loading playlists…</p>':v.nextListPage?'<button class="pill" id="more-playlists">Load more playlists</button>':v.loaded&&!v.items.length?empty('No public playlists found','This approved channel has no public playlists.'):'' );
 }else{html='<button class="pill" id="back-playlists">← All playlists</button><h2>'+esc(a.title)+'</h2><p>'+a.entries.length+' approved entries loaded · '+a.excluded+' unavailable or unapproved entries excluded.</p><div class="toolbar"><button class="pill red" id="play-playlist">Play playlist</button>'+(!a.started||a.nextPage?'<button class="pill" id="more-playlist-entries">Load more entries</button><button class="pill" id="all-playlist-entries">Load entire playlist</button>':'')+(a.loadingAll?'<button class="pill" id="stop-playlist-loading">Stop loading</button>':'')+'</div><p role="status">'+esc(a.error|| (a.loading?'Loading playlist entries…':a.loadingAll?'Loading remaining pages…':a.started&&!a.nextPage?'Complete playlist loaded.':'More entries remain. Play playlist loads them before starting.'))+'</p>'+(!a.entries.length&&a.started&&!a.nextPage?empty('No approved videos in this playlist','Unavailable or unapproved entries are excluded.'):'')+'<div class="grid playlist-entries">'+a.entries.map((x,i)=>card(x).replace('data-video=','data-entry-index="'+i+'" data-video=')).join('')+'</div>'}
 $('#playlists').innerHTML=html;bind();
 document.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=()=>openPlaylist(b.dataset.playlist));$('#more-playlists')?.addEventListener('click',()=>loadPlaylists(true));$('#retry-playlists')?.addEventListener('click',()=>loadPlaylists(!v.loaded?false:true));
 $('#back-playlists')?.addEventListener('click',()=>{if(a)a.stop=true;v.active=null;renderPlaylistView()});$('#more-playlist-entries')?.addEventListener('click',()=>loadPlaylistPage(v,a));$('#all-playlist-entries')?.addEventListener('click',()=>loadEntirePlaylist(v,a));$('#stop-playlist-loading')?.addEventListener('click',()=>{a.stop=true});$('#play-playlist')?.addEventListener('click',async()=>{if(await loadEntirePlaylist(v,a)){const queue=a.entries.filter(x=>ch(x.channelId)).map(x=>x.id);if(queue.length)play(queue[0],queue,false,0,0)}});
 document.querySelectorAll('[data-entry-index]').forEach(b=>{const action=async()=>{const originalIndex=+b.dataset.entryIndex;if(!await loadEntirePlaylist(v,a))return;const entry=a.entries[originalIndex];if(!entry||!ch(entry.channelId))return;const i=a.entries.slice(0,originalIndex).filter(x=>ch(x.channelId)).length,queue=a.entries.filter(x=>ch(x.channelId)).map(x=>x.id);play(queue[i],queue,false,0,i)};b.onclick=action;b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}}});
}
async function loadPlaylists(more=false){if(!selected?.id)return;if(!playlistView||playlistView.channelId!==selected.id)playlistView={channelId:selected.id,items:[],loaded:false,nextListPage:null,loadingList:false,active:null};const v=playlistView;if(v.loadingList||v.loaded&&!more){renderPlaylistView();return}if(more&&!v.nextListPage)return;v.loadingList=true;v.error='';renderPlaylistView();try{const d=await api('/api/playlists?id='+encodeURIComponent(v.channelId)+(more?'&page='+encodeURIComponent(v.nextListPage):''));const m=new Map(v.items.map(x=>[x.id,x]));for(const p of d.items){m.set(p.id,p);playlistSearchCache.set(p.id,{...p,channelId:v.channelId,cachedAt:Date.now()})}v.items=[...m.values()];v.nextListPage=d.nextPage||null;v.loaded=true}catch(e){v.error=e.message}finally{v.loadingList=false;renderPlaylistView()}}
async function openPlaylist(id){const v=playlistView,p=v?.items.find(x=>x.id===id);if(!p||!playlistContext(v))return;const a=v.active={id,title:p.title,entries:[],excluded:0,nextPage:undefined,started:false,loading:false,loadingAll:false,stop:false,error:'',seenPages:new Set()};renderPlaylistView();await loadPlaylistPage(v,a)}
async function loadPlaylistPage(v,a){if(!a||a.loading||a.started&&!a.nextPage||!playlistContext(v)||v.active!==a)return false;a.loading=true;a.error='';renderPlaylistView();try{const token=a.nextPage||'';if(a.seenPages.has(token))throw Error('YouTube repeated a playlist page. Try reopening the playlist.');const d=await api('/api/playlist?id='+encodeURIComponent(a.id)+(token?'&page='+encodeURIComponent(token):''));if(!playlistContext(v)||v.active!==a)return false;mergeApprovedVideos(d.videos);const permitted=d.videos.filter(x=>ch(x.channelId));a.entries.push(...permitted);a.excluded+=(d.entryCount??d.videos.length)-permitted.length;a.started=true;a.seenPages.add(token);a.nextPage=d.nextPage||null;await persist();return true}catch(e){a.error=e.message;return false}finally{a.loading=false;renderPlaylistView()}}
async function loadEntirePlaylist(v,a){if(!a||a.loading||a.loadingAll)return false;a.stop=false;a.loadingAll=true;a.error='';renderPlaylistView();try{while((!a.started||a.nextPage)&&!a.stop&&playlistContext(v)&&v.active===a){if(!await loadPlaylistPage(v,a))return false}return !a.stop&&a.started&&!a.nextPage&&playlistContext(v)&&v.active===a}finally{a.loadingAll=false;renderPlaylistView()}}
function isLeBatard(v){return v?.channelId==='UCAIZ314ffmfM4PynCR8vElw'||ch(v?.channelId)?.handle?.toLowerCase()==='lebatardshow'}
async function preferredChapterAuthorId(){
 if(st.chapterAuthor?.id&&Date.now()-st.chapterAuthor.at<86400000)return st.chapterAuthor.id;
 const d=await yt('channels',{part:'id',forHandle:'IrishWeegee'});const id=d.items?.[0]?.id;if(!/^UC[\w-]{22}$/.test(id||''))throw Error('Could not verify @IrishWeegee’s YouTube channel. Try Refresh chapters.');
 st.chapterAuthor={id,at:Date.now()};await persist();return id;
}
async function retrieveChapterComment(videoId,pageToken){
 const v=st.videos.find(v=>v.id===videoId);if(!v||!ch(v.channelId)||!isLeBatard(v))throw Error('Timestamp-comment lookup is limited to approved Le Batard videos.');
 const authorId=await preferredChapterAuthorId();let scanned=0;
 for(let i=0;i<5;i++){
  const d=await yt('commentThreads',{part:'snippet',videoId,maxResults:100,order:'relevance',textFormat:'plainText',pageToken});
  for(const item of d.items||[]){scanned++;const comment=item.snippet?.topLevelComment?.snippet;if(comment?.authorChannelId?.value===authorId&&parseChapters(comment.textOriginal||comment.textDisplay||'',v.duration).length)return{text:comment.textOriginal||comment.textDisplay,commentId:item.snippet.topLevelComment.id,scanned,nextPage:null}}
  pageToken=d.nextPageToken;if(!pageToken)break;
 }return{text:null,scanned,nextPage:pageToken||null};
}
function parseChapters(text,duration=current?.duration){
 const result=[],seen=new Set(),lines=String(text||'').split(/\r?\n/),stamp=s=>{const p=s.split(':').map(Number);if(p.some(x=>!Number.isFinite(x))||p.at(-1)>=60||p.length===3&&p[1]>=60)return null;return p.reduce((a,n)=>a*60+n,0)};
 for(let i=0;i<lines.length;i++){
  const m=lines[i].match(/^\s*(?:[-•*]\s*)?\[?((?:\d+:)?\d{1,2}:\d{2})(?:\s*[-–—]\s*((?:\d+:)?\d{1,2}:\d{2}))?\]?\s*[-–—:•|]?\s*(.*)$/);if(!m)continue;
  const seconds=stamp(m[1]);if(seconds===null)continue;let title=m[3].trim();if(!title&&lines[i+1]&&!/^\s*\[?\d+:/.test(lines[i+1]))title=lines[i+1].trim();
  if(title&&(!duration||seconds<duration)&&!seen.has(seconds)){seen.add(seconds);result.push({seconds,title})}
 }return result.sort((a,b)=>a.seconds-b.seconds);
}
function activeChapterAt(times,position){return times.reduce((best,t)=>t<=position&&(best===null||t>best)?t:best,null)}
function updateActiveChapter(position){const rows=[...$('#chapters').querySelectorAll('[data-seek]')],active=activeChapterAt(rows.map(b=>+b.dataset.seek),position);for(const b of rows)b.setAttribute('aria-current',String(+b.dataset.seek===active))}
function showChapterPanel(v,chapters,source,note='',nextPage=null){
 if(current?.id!==v.id)return;const target=$('#chapters');
 target.innerHTML='<h3>Chapters</h3>'+(source?'<div class="chapter-source">'+esc(source)+'</div>':'')+(note?'<p role="status">'+esc(note)+'</p>':'')+(isLeBatard(v)?'<div class="toolbar"><button class="pill" id="refresh-chapters">Refresh chapters</button>'+(nextPage?'<button class="pill" id="more-chapters">Search more comments</button>':'')+'</div>':'')+chapters.map(c=>'<button class="chapter-row" data-seek="'+c.seconds+'" aria-current="false"><span class="chapter-time">'+time(c.seconds)+'</span><span class="chapter-title">'+esc(c.title)+'</span></button>').join('');
 target.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{if(!playerReady||!playerMatchesVideo(player))return toast('Start this video inside YouView to use chapters.');player.seekTo(+b.dataset.seek,true);updateActiveChapter(+b.dataset.seek);setTimeout(saveProgress,350)});
 $('#refresh-chapters')?.addEventListener('click',()=>loadChapters(v,{force:true}));$('#more-chapters')?.addEventListener('click',()=>loadChapters(v,{force:true,pageToken:nextPage}));
}
let chapterRequest=0;
async function loadChapters(v,{force=false,pageToken}={}){
 const request=++chapterRequest,fallback=parseChapters(v.description,v.duration),preferred=isLeBatard(v);if(!preferred){showChapterPanel(v,fallback,'Description timestamps',fallback.length?'':'No description timestamps available.');return}
 st.chapterCache=st.chapterCache||{};const cached=st.chapterCache[v.id];
 if(!force&&cached?.parserVersion===2&&Date.now()-cached.at<(cached.text?86400000:600000)){const chapters=cached.text?parseChapters(cached.text,v.duration):fallback;showChapterPanel(v,chapters,cached.text?'@IrishWeegee timestamps':'Description timestamps',cached.text?'':'Preferred timestamp comment not found in the comments checked so far.',cached.nextPage);return}
 if(!youtubeKey){showChapterPanel(v,fallback,'Description timestamps','Connect your existing YouTube API key in Settings to retrieve @IrishWeegee’s comment. Video playback can use saved metadata without that connection.');return}
 showChapterPanel(v,fallback,'Description timestamps','Looking for @IrishWeegee’s timestamp comment…');
 try{
  const d=await api('/api/chapters?video='+encodeURIComponent(v.id)+(pageToken?'&page='+encodeURIComponent(pageToken):''));
  st.chapterCache[v.id]={...d,parserVersion:2,at:Date.now()};await persist();if(request!==chapterRequest||current?.id!==v.id)return;
  const chapters=d.text?parseChapters(d.text,v.duration):fallback;showChapterPanel(v,chapters,d.text?'@IrishWeegee timestamps':'Description timestamps',d.text?'':d.nextPage?'Not found in this batch ('+d.scanned+' comments checked). Search more comments or refresh later.':'No timestamp comment from @IrishWeegee was found in the accessible comments.',d.nextPage);
 }catch(e){if(request===chapterRequest)showChapterPanel(v,fallback,'Description timestamps','Timestamp lookup failed: '+e.message+' Use Refresh chapters to try again.')}
}
