let ytPromise=null,playerReady=false,pendingVideo=null,playRequest=0,playerTimer=null;

function ensureYT(){
 if(window.YT?.Player)return Promise.resolve();
 if(ytPromise)return ytPromise;
 ytPromise=new Promise((resolve,reject)=>{
  const timeout=setTimeout(()=>{ytPromise=null;reject(Error('YouTube’s player could not load. Check your connection and retry.'))},15000);
  window.onYouTubeIframeAPIReady=()=>{clearTimeout(timeout);resolve()};
  let script=document.getElementById('youtube-api-script');
  if(script)script.remove();
  script=document.createElement('script');script.id='youtube-api-script';script.src='https://www.youtube.com/iframe_api';
  script.onerror=()=>{clearTimeout(timeout);ytPromise=null;script.remove();reject(Error('YouTube’s player could not load. Check your connection and retry.'))};
  document.head.append(script);
 });return ytPromise;
}

async function loadPlaylists(){if(!selected?.id){$('#playlists').innerHTML=empty('Connect this channel first','Paste its channel URL in Your channels.');return}try{const d=await api('/api/playlists?id='+selected.id);if(!$('#playlists'))return;$('#playlists').innerHTML=d.items.length?d.items.map(p=>'<div class="row"><div class="name">'+esc(p.title)+'</div><button class="pill" data-playlist="'+esc(p.id)+'">Browse</button></div>').join(''):empty('No playlists found','This channel has no public playlists.');document.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=async()=>{try{const d=await api('/api/playlist?id='+b.dataset.playlist);const permitted=d.videos.filter(v=>ch(v.channelId));for(const v of permitted)if(!st.videos.some(x=>x.id===v.id))st.videos.push(v);persist();$('#playlists').innerHTML='<button class="pill red" id="play-all">Play approved videos in order</button><p class="muted">'+(d.videos.length-permitted.length)+' entries from unapproved channels excluded. Select a video to play.</p><div class="grid">'+permitted.map(card).join('')+'</div>';bind();$('#play-all').onclick=()=>{if(permitted.length)play(permitted[0].id,permitted.map(v=>v.id))}}catch(e){toast(e.message)}})}catch(e){if($('#playlists'))$('#playlists').innerHTML=empty('Playlists need the free API connection',esc(e.message))}}
function parseChapters(text){const result=[];for(const line of text.split('\n')){const m=line.match(/(?:^|\s)(?:(\d+):)?(\d{1,2}):(\d{2})\s*[-–—:]?\s*(.+)/);if(m){const seconds=(+m[1]||0)*3600+(+m[2])*60+(+m[3]);if(!current?.duration||seconds<current.duration)result.push({seconds,title:m[4]})}}return result}
async function loadChapters(v){let text=v.description||'',source='Description timestamps';if(ch(v.channelId)?.handle?.toLowerCase()==='lebatardshow'){try{const d=await api('/api/chapters?video='+v.id);if(d.text){text=d.text;source='@IrishWeegee timestamps'}}catch{}}if(current?.id!==v.id)return;const chapters=parseChapters(text);$('#chapters').innerHTML=chapters.length?'<div class="muted">'+source+'</div>'+chapters.map(c=>'<button data-seek="'+c.seconds+'">'+time(c.seconds)+'　'+esc(c.title)+'</button>').join(''):'';document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{player?.seekTo(+b.dataset.seek,true);setTimeout(saveProgress,350)})}
ready.then(()=>{render();refresh();});
