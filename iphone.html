$('#searchform').onsubmit=e=>{e.preventDefault();const value=$('#query').value.trim();if(parseVideoUrl(value))return openVideoUrl(value);query=value;searchVisible=100;remoteSearch=null;if(route==='channel')tab='Videos';if(!['channel','history','continue'].includes(route))route='search';render();if(query&&youtubeKey&&['channel','search'].includes(route))indexOlderUploads(3)};document.addEventListener('visibilitychange',()=>{saveProgress();if(document.hidden){if(playerReady)player?.pauseVideo()}else if(route==='history'||route==='continue')render()});window.addEventListener('pagehide',()=>saveProgress());let touchY=0;document.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(scrollY===0&&e.changedTouches[0].clientY-touchY>100&&route==='home')refresh(true)},{passive:true});
function playlistContext(v){return playlistView===v&&route==='channel'&&tab==='Playlists'&&selected?.id===v.channelId}
function renderPlaylistView(){const v=playlistView;if(!v||!playlistContext(v)||!$('#playlists'))return;const a=v.active;let html='';
 if(!a){html='<div class="rows">'+v.items.map(p=>'<div class="row"><div class="name">'+esc(p.title)+'</div><button class="pill" data-playlist="'+esc(p.id)+'">Browse</button></div>').join('')+'</div>'+(v.error?'<p role="status">'+esc(v.error)+'</p><button class="pill" id="retry-playlists">Retry playlists</button>':'')+(v.loadingList?'<p role="status">Loading playlists…</p>':v.nextListPage?'<button class="pill" id="more-playlists">Load more playlists</button>':v.loaded&&!v.items.length?empty('No public playlists found','This approved channel has no public playlists.'):'' );
 }else{html='<button class="pill" id="back-playlists">← All playlists</button><h2>'+esc(a.title)+'</h2><p>'+a.entries.length+' approved entries loaded · '+a.excluded+' unavailable or unapproved entries excluded.</p><div class="toolbar"><button class="pill red" id="play-playlist">Play playlist</button>'+(!a.started||a.nextPage?'<button class="pill" id="more-playlist-entries">Load more entries</button><button class="pill" id="all-playlist-entries">Load entire playlist</button>':'')+(a.loadingAll?'<button class="pill" id="stop-playlist-loading">Stop loading</button>':'')+'</div><p role="status">'+esc(a.error|| (a.loading?'Loading playlist entries…':a.loadingAll?'Loading remaining pages…':a.started&&!a.nextPage?'Complete playlist loaded.':'More entries remain. Play playlist loads them before starting.'))+'</p><div class="grid">'+a.entries.map((x,i)=>card(x).replace('data-video=','data-entry-index="'+i+'" data-video=')).join('')+'</div>'}
 $('#playlists').innerHTML=html;bind();
 document.querySelectorAll('[data-playlist]').forEach(b=>b.onclick=()=>openPlaylist(b.dataset.playlist));$('#more-playlists')?.addEventListener('click',()=>loadPlaylists(true));$('#retry-playlists')?.addEventListener('click',()=>loadPlaylists(!v.loaded?false:true));
 $('#back-playlists')?.addEventListener('click',()=>{if(a)a.stop=true;v.active=null;renderPlaylistView()});$('#more-playlist-entries')?.addEventListener('click',()=>loadPlaylistPage(v,a));$('#all-playlist-entries')?.addEventListener('click',()=>loadEntirePlaylist(v,a));$('#stop-playlist-loading')?.addEventListener('click',()=>{a.stop=true});$('#play-playlist')?.addEventListener('click',async()=>{if(await loadEntirePlaylist(v,a)){const queue=a.entries.filter(x=>ch(x.channelId)).map(x=>x.id);if(queue.length)play(queue[0],queue,false,0,0)}});
 document.querySelectorAll('[data-entry-index]').forEach(b=>{const action=async()=>{const originalIndex=+b.dataset.entryIndex;if(!await loadEntirePlaylist(v,a))return;const entry=a.entries[originalIndex];if(!entry||!ch(entry.channelId))return;const i=a.entries.slice(0,originalIndex).filter(x=>ch(x.channelId)).length,queue=a.entries.filter(x=>ch(x.channelId)).map(x=>x.id);play(queue[i],queue,false,0,i)};b.onclick=action;b.onkeydown=e=>{if(e.key==='Enter')action()}});
}
async function loadPlaylists(more=false){if(!selected?.id)return;if(!playlistView||playlistView.channelId!==selected.id)playlistView={channelId:selected.id,items:[],loaded:false,nextListPage:null,loadingList:false,active:null};const v=playlistView;if(v.loadingList||v.loaded&&!more){renderPlaylistView();return}if(more&&!v.nextListPage)return;v.loadingList=true;v.error='';renderPlaylistView();try{const d=await api('/api/playlists?id='+encodeURIComponent(v.channelId)+(more?'&page='+encodeURIComponent(v.nextListPage):''));const m=new Map(v.items.map(x=>[x.id,x]));for(const p of d.items)m.set(p.id,p);v.items=[...m.values()];v.nextListPage=d.nextPage||null;v.loaded=true}catch(e){v.error=e.message}finally{v.loadingList=false;renderPlaylistView()}}
async function openPlaylist(id){const v=playlistView,p=v?.items.find(x=>x.id===id);if(!p||!playlistContext(v))return;const a=v.active={id,title:p.title,entries:[],excluded:0,nextPage:undefined,started:false,loading:false,loadingAll:false,stop:false,error:'',seenPages:new Set()};renderPlaylistView();await loadPlaylistPage(v,a)}
async function loadPlaylistPage(v,a){if(!a||a.loading||a.started&&!a.nextPage||!playlistContext(v)||v.active!==a)return false;a.loading=true;a.error='';renderPlaylistView();try{const token=a.nextPage||'';if(a.seenPages.has(token))throw Error('YouTube repeated a playlist page. Try reopening the playlist.');const d=await api('/api/playlist?id='+encodeURIComponent(a.id)+(token?'&page='+encodeURIComponent(token):''));if(!playlistContext(v)||v.active!==a)return false;mergeApprovedVideos(d.videos);const permitted=d.videos.filter(x=>ch(x.channelId));a.entries.push(...permitted);a.excluded+=(d.entryCount??d.videos.length)-permitted.length;a.started=true;a.seenPages.add(token);a.nextPage=d.nextPage||null;await persist();return true}catch(e){a.error=e.message;return false}finally{a.loading=false;renderPlaylistView()}}
async function loadEntirePlaylist(v,a){if(!a||a.loading||a.loadingAll)return false;a.stop=false;a.loadingAll=true;a.error='';renderPlaylistView();try{while((!a.started||a.nextPage)&&!a.stop&&playlistContext(v)&&v.active===a){if(!await loadPlaylistPage(v,a))return false}return !a.stop&&a.started&&!a.nextPage&&playlistContext(v)&&v.active===a}finally{a.loadingAll=false;renderPlaylistView()}}
function isLeBatard(v){return v?.channelId==='UCAIZ314ffmfM4PynCR8vElw'||ch(v?.channelId)?.handle?.toLowerCase()==='lebatardshow'}
async function preferredChapterAuthorId(){
 if(st.chapterAuthor?.id&&Date.now()-st.chapterAuthor.at<86400000)return st.chapterAuthor.id;
 const d=await yt('channels',{part:'id',forHandle:'IrishWeegee'});const id=d.items?.[0]?.id;if(!/^UC[\w-]{22}$/.test(id||''))throw Error('Could not verify @IrishWeegee’s YouTube channel. Try Refresh chapters.');
 st.chapterAuthor={id,at:Date.now()};await persist();return id;
}
async function retrieveChapterComment(videoId,pageToken){
 const v=st.videos.find(v=>v.id===videoId);if(!v||!ch(v.channelId)||!isLeBatard(v))throw Error('Timestamp-comment lookup is limited to approved Le Batard videos.');
 const authorId=await preferredChapterAuthorId();let scanned=0;
 for(let i=0;i<5;i++){
  const d=await yt('commentThreads',{part:'snippet',videoId,maxResults:100,order:'relevance',textFormat:'plainText',pageToken});
  for(const item of d.items||[]){scanned++;const comment=item.snippet?.topLevelComment?.snippet;if(comment?.authorChannelId?.value===authorId&&parseChapters(comment.textOriginal||comment.textDisplay||'',v.duration).length)return{text:comment.textOriginal||comment.textDisplay,commentId:item.snippet.topLevelComment.id,scanned,nextPage:null}}
  pageToken=d.nextPageToken;if(!pageToken)break;
 }return{text:null,scanned,nextPage:pageToken||null};
}
function parseChapters(text,duration=current?.duration){
 const result=[],seen=new Set(),lines=String(text||'').split(/\r?\n/),stamp=s=>{const p=s.split(':').map(Number);if(p.some(x=>!Number.isFinite(x))||p.at(-1)>=60||p.length===3&&p[1]>=60)return null;return p.reduce((a,n)=>a*60+n,0)};
 for(let i=0;i<lines.length;i++){
  const m=lines[i].match(/^\s*(?:[-•*]\s*)?\[?((?:\d+:)?\d{1,2}:\d{2})(?:\s*[-–—]\s*((?:\d+:)?\d{1,2}:\d{2}))?\]?\s*[-–—:•|]?\s*(.*)$/);if(!m)continue;
  const seconds=stamp(m[1]);if(seconds===null)continue;let title=m[3].trim();if(!title&&lines[i+1]&&!/^\s*\[?\d+:/.test(lines[i+1]))title=lines[i+1].trim();
  if(title&&(!duration||seconds<duration)&&!seen.has(seconds)){seen.add(seconds);result.push({seconds,title})}
 }return result.sort((a,b)=>a.seconds-b.seconds);
}
function showChapterPanel(v,chapters,source,note='',nextPage=null){
 if(current?.id!==v.id)return;const target=$('#chapters');
 target.innerHTML='<h3>Chapters</h3>'+(source?'<div class="muted">'+esc(source)+'</div>':'')+(note?'<p role="status">'+esc(note)+'</p>':'')+(isLeBatard(v)?'<div class="toolbar"><button class="pill" id="refresh-chapters">Refresh chapters</button>'+(nextPage?'<button class="pill" id="more-chapters">Search more comments</button>':'')+'</div>':'')+chapters.map(c=>'<button data-seek="'+c.seconds+'">'+time(c.seconds)+'　'+esc(c.title)+'</button>').join('');
 target.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{if(!playerReady||!playerMatchesVideo(player))return toast('Start this video inside YouView to use chapters.');player.seekTo(+b.dataset.seek,true);setTimeout(saveProgress,350)});
 $('#refresh-chapters')?.addEventListener('click',()=>loadChapters(v,{force:true}));$('#more-chapters')?.addEventListener('click',()=>loadChapters(v,{force:true,pageToken:nextPage}));
}
let chapterRequest=0;
async function loadChapters(v,{force=false,pageToken}={}){
 const request=++chapterRequest,fallback=parseChapters(v.description,v.duration),preferred=isLeBatard(v);if(!preferred){showChapterPanel(v,fallback,'Description timestamps',fallback.length?'':'No description timestamps available.');return}
 st.chapterCache=st.chapterCache||{};const cached=st.chapterCache[v.id];
 if(!force&&cached?.parserVersion===2&&Date.now()-cached.at<(cached.text?86400000:600000)){const chapters=cached.text?parseChapters(cached.text,v.duration):fallback;showChapterPanel(v,chapters,cached.text?'@IrishWeegee timestamps':'Description timestamps',cached.text?'':'Preferred timestamp comment not found in the comments checked so far.',cached.nextPage);return}
 if(!youtubeKey){showChapterPanel(v,fallback,'Description timestamps','Connect your existing YouTube API key in Settings to retrieve @IrishWeegee’s comment. Video playback can use saved metadata without that connection.');return}
 showChapterPanel(v,fallback,'Description timestamps','Looking for @IrishWeegee’s timestamp comment…');
 try{
  const d=await api('/api/chapters?video='+encodeURIComponent(v.id)+(pageToken?'&page='+encodeURIComponent(pageToken):''));
  st.chapterCache[v.id]={...d,parserVersion:2,at:Date.now()};await persist();if(request!==chapterRequest||current?.id!==v.id)return;
  const chapters=d.text?parseChapters(d.text,v.duration):fallback;showChapterPanel(v,chapters,d.text?'@IrishWeegee timestamps':'Description timestamps',d.text?'':d.nextPage?'Not found in this batch ('+d.scanned+' comments checked). Search more comments or refresh later.':'No timestamp comment from @IrishWeegee was found in the accessible comments.',d.nextPage);
 }catch(e){if(request===chapterRequest)showChapterPanel(v,fallback,'Description timestamps','Timestamp lookup failed: '+e.message+' Use Refresh chapters to try again.')}
}
